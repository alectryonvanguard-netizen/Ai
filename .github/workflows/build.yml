name: Build Ronex Ai Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        id: sdk

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential
          python3 -m pip install --upgrade pip
          # Explicitly pinning cython to avoid modern compilation build errors with Buildozer
          python3 -m pip install buildozer "cython<3.0.0" virtualenv

      - name: Configure Gemini API for this build
        env:
          GEMINIAPIKEY: ${{ secrets.GEMINIAPIKEY }}
        run: |
          if [ -z "$GEMINIAPIKEY" ]; then
            echo "Missing repository secret GEMINIAPIKEY"
            exit 1
          fi
          sed -i "s/PASTE_YOUR_GEMINI_API_KEY_HERE/${GEMINIAPIKEY}/g" main.py

      - name: Build debug APK
        env:
          # Explicitly link GitHub environments to Buildozer pathways
          ANDROID_HOME: ${{ steps.sdk.outputs.sdk-path }}
          ANDROID_SDK_ROOT: ${{ steps.sdk.outputs.sdk-path }}
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          # Added -v (verbose flag) so logs are descriptive before any truncation happens
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ronex-ai-debug-apk
          path: bin/*.apk
          if-no-files-found: error
