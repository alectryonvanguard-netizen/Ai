name: Build Ronex Ai Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      # Optional: You can specify explicit SDK/NDK packages here if Buildozer requires a specific API level:
      # with:
      #   packages: "platforms;android-33 build-tools;33.0.2 ndk;25.2.9519653"

      # Removed openjdk-17-jdk from apt-get to avoid double-allocation/conflicts
       Pentest dependency tracking
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer cython virtualenv

      - name: Configure Gemini API for this build
        env:
          GEMINIAPIKEY: ${{ secrets.GEMINIAPIKEY }}
        run: |
          if [ -z "$GEMINIAPIKEY" ]; then
            echo "Missing repository secret GEMINIAPIKEY"
            exit 1
          fi
          sed -i "s/PASTE_YOUR_GEMINI_API_KEY_HERE/${GEMINIAPIKEY}/g" main.py

      # Cleaned up hardcoded /root/ paths so Buildozer dynamically targets the SDK setup action paths
      - name: Build debug APK
        run: yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ronex-ai-debug-apk
          path: bin/*.apk
          if-no-files-found: error
